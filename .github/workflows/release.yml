# Release yayınlanınca Windows kurulumunu (.exe), Linux paketini (.deb) ve macOS paketini (.dmg)
# derleyip release'e ekler; hepsi bitince SHA256SUMS.txt release'teki tüm
# kurulumlar için yeniden üretilir. Elle yeniden çalıştırmak için:
# Actions -> Release -> Run.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar (.venv)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt

      - name: PyInstaller bundle
        run: .\build.ps1

      - name: Inno Setup kurulumu
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MDFlowViewer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC basarisiz" }

      - name: Release'e yükle
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          $exe = "dist\MDViewer-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "Kurulum bulunamadi: $exe" }
          gh release upload $env:TAG $exe --clobber

  linux-deb:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: .deb paketi
        run: bash packaging/linux/build-deb.sh

      - name: Release'e yükle
        run: |
          deb="dist/mdflowviewer_${TAG#v}_all.deb"
          test -f "$deb" || { echo "Paket bulunamadi: $deb" >&2; exit 1; }
          gh release upload "$TAG" "$deb" --clobber

  macos-dmg:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: .app ve .dmg
        run: bash packaging/macos/build-dmg.sh

      - name: Paketlenmiş uygulamayı dene
        timeout-minutes: 3
        run: '"dist/MD Flow Viewer.app/Contents/MacOS/MD Flow Viewer" --selftest'

      - name: Release'e yükle
        run: |
          dmg="dist/MDViewer-${TAG}-macos-arm64.dmg"
          test -f "$dmg" || { echo "Paket bulunamadi: $dmg" >&2; exit 1; }
          gh release upload "$TAG" "$dmg" --clobber

  checksums:
    needs: [windows-setup, linux-deb, macos-dmg]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS
        run: |
          # Release'teki tüm kurulumların (exe + deb + dmg) özetini yeniden üret
          mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D sums -p "*.exe" -p "*.deb" -p "*.dmg"
          (cd sums && sha256sum * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
