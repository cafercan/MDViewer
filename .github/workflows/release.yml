# Release yayınlanınca Windows kurulumunu (.exe), Linux paketini (.deb) ve macOS paketini (.dmg)
# derleyip release'e ekler; hepsi bitince SHA256SUMS.txt release'teki tüm
# kurulumlar için yeniden üretilir. Elle yeniden çalıştırmak için:
# Actions -> Release -> Run.
#
# Her paketleme betiği derlenen uygulamayı pencere açmadan --selftest ile dener.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Exe ve kurulum
        run: .\scripts\build-installer.ps1

      - name: Release'e yükle
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          $exe = "dist\MDViewer-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "Kurulum bulunamadi: $exe" }
          gh release upload $env:TAG $exe --clobber

  linux-deb:
    # Paket derlendiği dağıtımın glibc'sini ister: desteklenen en eski Ubuntu'da derle
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: WebKitGTK geliştirme paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: .deb paketi
        run: bash packaging/linux/build-deb.sh

      - name: Release'e yükle
        run: |
          deb="dist/mdflowviewer_${TAG#v}_amd64.deb"
          test -f "$deb" || { echo "Paket bulunamadi: $deb" >&2; exit 1; }
          gh release upload "$TAG" "$deb" --clobber

  macos-dmg:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: .app ve .dmg
        timeout-minutes: 30
        run: bash packaging/macos/build-dmg.sh

      - name: Release'e yükle
        run: |
          dmg="dist/MDViewer-${TAG}-macos-arm64.dmg"
          test -f "$dmg" || { echo "Paket bulunamadi: $dmg" >&2; exit 1; }
          gh release upload "$TAG" "$dmg" --clobber

  checksums:
    needs: [windows-setup, linux-deb, macos-dmg]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS
        run: |
          # Release'teki tüm kurulumların (exe + deb + dmg) özetini yeniden üret
          mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D sums -p "*.exe" -p "*.deb" -p "*.dmg"
          (cd sums && sha256sum * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
