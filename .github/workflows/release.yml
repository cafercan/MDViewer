# Release yayınlanınca Windows kurulumunu (.exe), Linux paketlerini (.deb, .rpm, Arch için
# .pkg.tar.zst) ve macOS paketini (.dmg) derleyip release'e ekler, AUR paketlerini (mdflowviewer, mdflowviewer-bin) günceller;
# hepsi bitince SHA256SUMS.txt release'teki tüm
# kurulumlar için yeniden üretilir. Elle yeniden çalıştırmak için:
# Actions -> Release -> Run.
#
# Her paketleme betiği derlenen uygulamayı pencere açmadan --selftest ile dener.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Exe ve kurulum
        run: .\scripts\build-installer.ps1

      - name: Release'e yükle
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          $exe = "dist\MDViewer-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "Kurulum bulunamadi: $exe" }
          gh release upload $env:TAG $exe --clobber

  linux-deb:
    # Paket derlendiği dağıtımın glibc'sini ister: desteklenen en eski Ubuntu'da derle
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: WebKitGTK geliştirme paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci

      - name: .deb paketi
        run: bash packaging/linux/build-deb.sh

      - name: .rpm paketi (aynı ikili)
        run: bash packaging/linux/build-rpm.sh

      - name: Release'e yükle
        run: |
          deb="dist/mdflowviewer_${TAG#v}_amd64.deb"
          rpm="dist/mdflowviewer-${TAG#v}-1.x86_64.rpm"
          for f in "$deb" "$rpm"; do
            test -f "$f" || { echo "Paket bulunamadi: $f" >&2; exit 1; }
          done
          gh release upload "$TAG" "$deb" "$rpm" --clobber

  macos-dmg:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci

      - name: .app ve .dmg
        timeout-minutes: 30
        run: bash packaging/macos/build-dmg.sh

      - name: Release'e yükle
        run: |
          dmg="dist/MDViewer-${TAG}-macos-arm64.dmg"
          test -f "$dmg" || { echo "Paket bulunamadi: $dmg" >&2; exit 1; }
          gh release upload "$TAG" "$dmg" --clobber

  linux-pacman:
    # Arch paketi (.pkg.tar.zst): mdflowviewer-bin PKGBUILD'i ile release'teki .deb'den üretilir.
    # C Launcher Arch'ta bunu "pacman -U" ile kurar. AUR anahtarından bağımsızdır.
    needs: [linux-deb]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Araçlar
        run: |
          pacman -Syu --noconfirm --needed github-cli pacman-contrib
          # makepkg root olarak çalışmaz
          useradd -m builder

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: repo

      - name: Paketle ve yükle
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          cp -r repo/packaging/arch/mdflowviewer-bin build
          sed -i -e "s/^pkgver=.*/pkgver=$VER/" -e "s/^pkgrel=.*/pkgrel=1/" build/PKGBUILD
          chown -R builder build
          # -d: çalışma bağımlılıkları paketlemek için gerekmez (yalnızca .deb açılır)
          su builder -c "cd build && updpkgsums && makepkg -d -f --noconfirm"
          pkg="build/mdflowviewer-bin-$VER-1-x86_64.pkg.tar.zst"
          test -f "$pkg" || { ls build >&2; echo "Paket bulunamadi: $pkg" >&2; exit 1; }
          gh release upload "$TAG" "$pkg" -R "$GITHUB_REPOSITORY" --clobber

  aur:
    # AUR'daki mdflowviewer ve mdflowviewer-bin paketlerini bu sürüme günceller.
    # packaging/arch/*/PKGBUILD şablon olarak kullanılır (pkgver etiketten, pkgrel=1).
    # Gerekli secret: AUR_SSH_PRIVATE_KEY (AUR hesabına eklenmiş bir SSH anahtarı).
    # Secret yoksa iş atlanır; release'i bozmaz.
    needs: [linux-deb]   # -bin paketi release'teki .deb'in özetini ister
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Secret var mı
        id: key
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY yok, AUR güncellemesi atlandı"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Araçlar
        if: steps.key.outputs.ok == 'true'
        run: |
          pacman -Syu --noconfirm --needed git openssh pacman-contrib
          # makepkg root olarak çalışmaz
          useradd -m builder

      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}
          path: repo

      - name: AUR'a gönder
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "flear"
          git config --global user.email "teymurzadehuseyn14@gmail.com"
          git config --global init.defaultBranch master
          # klasörler builder kullanıcısına ait; git root olarak çalışıyor
          git config --global --add safe.directory "*"

          for p in mdflowviewer mdflowviewer-bin; do
            git clone "ssh://aur@aur.archlinux.org/$p.git" "aur-$p"
            cp "repo/packaging/arch/$p/PKGBUILD" "aur-$p/PKGBUILD"
            sed -i -e "s/^pkgver=.*/pkgver=$VER/" -e "s/^pkgrel=.*/pkgrel=1/" "aur-$p/PKGBUILD"
            chown -R builder "aur-$p"
            su builder -c "cd aur-$p && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
            cd "aur-$p"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "$p: değişiklik yok"
            else
              git commit -m "$VER-1"
              git push origin master
              echo "$p: $VER-1 gönderildi"
            fi
            cd ..
          done

  checksums:
    needs: [windows-setup, linux-deb, linux-pacman, macos-dmg]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS
        run: |
          # Release'teki tüm kurulumların (exe + deb + rpm + pkg.tar.zst + dmg) özetini yeniden üret
          mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D sums -p "*.exe" -p "*.deb" -p "*.rpm" -p "*.pkg.tar.zst" -p "*.dmg"
          (cd sums && sha256sum * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
