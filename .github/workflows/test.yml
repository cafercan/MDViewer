# Her gönderimde: Rust testleri (çalışma alanı hapsi, ayarlar, belge okuma/yazma,
# izleyici, görsel protokolü) ve arayüz yardımcılarının Node testleri.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK geliştirme paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # macOS paketi her gönderimde derlenip denenir: release'te ilk kez kırılmasın
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: .app ve .dmg
        run: bash packaging/macos/build-dmg.sh
      - name: Paketlenmiş uygulamayı dene
        timeout-minutes: 3
        run: '"dist/MD Flow Viewer.app/Contents/MacOS/mdflowviewer" --selftest'
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: dist/*.dmg, retention-days: 7 }
