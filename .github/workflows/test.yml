# Her gönderimde: Python sunucu testleri (çalışma alanı hapsi, erişim denetimi)
# ve arayüz yardımcılarının Node testleri.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "flask>=3.0" "pytest>=8.0"
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.js
