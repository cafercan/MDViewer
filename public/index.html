<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Markdown Viewer & Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Raster favicons: Edge --app pencere/görev çubuğu ikonu SVG'yi
         kullanamıyor, bu yüzden .ico/.png raster sürümleri de veriyoruz. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="shortcut icon" href="/mdflow.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="/vendor/highlight.js/styles/tokyo-night-dark.min.css">
    <script src="/vendor/highlight.js/highlight.min.js"></script>
    
    <!-- Marked.js for Markdown Parsing -->
    <script src="/vendor/marked/marked.umd.js"></script>
    
    <!-- Mermaid.js for Diagram Rendering -->
    <script src="/vendor/mermaid/mermaid.min.js"></script>

    <!-- DOMPurify: sanitize rendered markdown HTML before it hits the DOM -->
    <script src="/vendor/dompurify/purify.min.js"></script>

    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Inline Custom Styles Placeholder (dynamically updated) -->
    <style id="custom-css-styles"></style>
</head>
<body>
    <div class="app-container">
        <!-- TOP NAVIGATION BAR -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    <span>MD<span class="logo-accent">Flow</span></span>
                </div>
            </div>
            
            <div class="header-center">
                <div class="current-file-badge" id="current-file" title="Düzenlenen dosya yolu">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span id="file-name-display">sample.md</span>
                </div>
            </div>
            
            <div class="header-right">
                <!-- View Mode Toggle Switch -->
                <div class="toggle-container">
                    <button class="toggle-btn active" id="btn-read-mode">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span>Oku</span>
                    </button>
                    <button class="toggle-btn" id="btn-edit-mode">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                        <span>Düzenle</span>
                    </button>
                </div>

                <!-- Custom Styling Button -->
                <button class="icon-btn" id="btn-settings" title="Özel CSS & Ayarlar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>

                <!-- Save Button (Only for edit mode) -->
                <button class="primary-btn hidden" id="btn-save">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span>Kaydet</span>
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <main class="main-layout">
            <!-- LEFT SIDEBAR -->
            <aside class="app-sidebar" id="sidebar">
                <!-- TOC Panel -->
                <div class="sidebar-section toc-section">
                    <div class="sidebar-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="21" y1="10" x2="7" y2="10"></line>
                            <line x1="21" y1="6" x2="3" y2="6"></line>
                            <line x1="21" y1="14" x2="7" y2="14"></line>
                            <line x1="21" y1="18" x2="3" y2="18"></line>
                            <path d="M3 10h.01"></path>
                            <path d="M3 14h.01"></path>
                        </svg>
                        <h3>İÇİNDEKİLER</h3>
                    </div>
                    <div class="toc-container" id="toc-list">
                        <!-- Headings will be injected dynamically -->
                        <span class="empty-state">Başlık bulunamadı</span>
                    </div>
                </div>

                <!-- Workspace Files Panel -->
                <div class="sidebar-section files-section">
                    <div class="sidebar-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h3>BELGELER</h3>
                    </div>
                    <div class="files-container" id="files-list">
                        <!-- Workspace md files will be injected here -->
                        <span class="empty-state">Yükleniyor...</span>
                    </div>
                </div>
            </aside>
            
            <!-- SIDEBAR TOGGLE GRIP (for sliding on smaller screens) -->
            <button class="sidebar-toggle-grip" id="sidebar-grip" title="Sidebar Kapat/Aç">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- MAIN WORKSPACE -->
            <section class="workspace-viewport">
                <!-- VIEW MODE: READ -->
                <div class="viewport-pane read-pane" id="pane-read">
                    <div class="markdown-body" id="markdown-viewer">
                        <!-- Markdown HTML is injected here -->
                    </div>
                </div>

                <!-- VIEW MODE: EDIT -->
                <div class="viewport-pane edit-pane hidden" id="pane-edit">
                    <div class="editor-container">
                        <div class="editor-header">
                            <div class="editor-info">
                                <span class="editor-indicator">Markdown Düzenleyici</span>
                                <span class="editor-save-type" id="save-status">Değişiklikler otomatik kaydedilir</span>
                            </div>
                            <div class="editor-actions">
                                <label class="checkbox-label" title="Yazmayı durdurduktan 1.5 saniye sonra diske kaydeder">
                                    <input type="checkbox" id="chk-autosave" checked>
                                    <span>Otomatik Kaydet</span>
                                </label>
                            </div>
                        </div>
                        <div class="editor-wrapper">
                            <div class="inline-editor markdown-body" id="inline-editor">
                                <!-- Dynamic block elements will be injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- SETTINGS / CUSTOM CSS DRAWER -->
        <div class="drawer-overlay" id="settings-drawer-overlay"></div>
        <div class="drawer" id="settings-drawer">
            <div class="drawer-header">
                <h3>Görünüm ve CSS Özelleştirme</h3>
                <button class="drawer-close-btn" id="btn-close-settings">&times;</button>
            </div>
            <div class="drawer-content">
                <div class="form-group">
                    <label>Tema Seçimi</label>
                    <select id="theme-selector">
                        <option value="slate-dark">Obsidian Dark (Modern Koyu)</option>
                        <option value="nord-dark">Nord Frost (Soğuk Koyu)</option>
                        <option value="minimal-light">Classic Light (Temiz Açık)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Özel CSS Dosya Yolu</label>
                    <div class="input-with-button">
                        <input type="text" id="custom-css-path" placeholder="Örn: C:/my-styles.css veya custom.css">
                        <button class="secondary-btn" id="btn-apply-css-path">Yükle</button>
                    </div>
                    <small>Yerel bilgisayarınızdaki bir CSS dosyasının mutlak yolunu girin.</small>
                </div>
                
                <div class="form-group">
                    <label>Özel Satır İçi CSS Kodları</label>
                    <textarea id="custom-inline-css" class="code-textarea" placeholder="h1 { color: #ff0055; }
.info-box { border-left: 4px solid cyan; }"></textarea>
                    <small>Bu sayfada anında uygulanacak CSS kurallarını buraya yazabilirsiniz.</small>
                </div>
                
                <div class="drawer-actions">
                    <button class="primary-btn fill-width" id="btn-save-settings">Ayarları Uygula</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="asset-url.js"></script>
    <script src="app.js"></script>
</body>
</html>
