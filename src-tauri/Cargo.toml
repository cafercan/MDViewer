[package]
name = "mdflowviewer"
version = "3.4.0"
edition = "2021"
license = "MIT"
description = "MD Flow Viewer: Markdown görüntüleyici ve düzenleyici"
default-run = "mdflowviewer"

[lib]
# Android (ve iOS) uygulamayı paylaşımlı kitaplık olarak yükler; masaüstü ikilisi
# de aynı kitaplıktaki `run()` fonksiyonunu çağırır.
name = "mdflowviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdflow-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
notify = "9"
# Güncelleme: indirme (rustls) ve özet doğrulama
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
snow = "0.10"
spake2 = "0.4"
if-addrs = "0.13"
getrandom = "0.3"

# Yalnız masaüstü: native dosya seçici, sistemde açma, pencere konumu.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
opener = "0.9"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
