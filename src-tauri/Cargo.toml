[package]
name = "mdflowviewer"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "MD Flow Viewer: Markdown görüntüleyici ve düzenleyici"
default-run = "mdflowviewer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdflow-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
opener = "0.9"
percent-encoding = "2"
notify = "6"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
